[package]
name = "reiver-flow"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"

[[bin]]
name = "reiver-flow"
path = "src/main.rs"

[[bin]]
name = "re-encrypt-secrets"
path = "src/bin/re_encrypt_secrets.rs"

[dependencies]
reiver-core = { path = "../core" }
reiver-mcp = { path = "../mcp" }
rmcp = { version = "1.2", features = ["server"] }

# Concurrency
arc-swap = "1.7"

# Web framework
axum = { version = "0.8.8", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["io-util"] }
async-stream = "0.3"
rdkafka = { version = "0.38.0", features = ["cmake-build", "ssl", "gssapi-vendored", "libz-static"] }

# Database
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "mysql", "chrono", "uuid", "json", "rust_decimal"] }
clickhouse = { version = "0.14.1", features = ["inserter", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "v7", "serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
rust_decimal = { version = "1.34", features = ["serde"] }

# Redis
redis = { version = "1.0.1", features = ["tokio-comp", "connection-manager"] }
bb8 = "0.9.1"
bb8-redis = "0.26.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"

# Synchronization
parking_lot = "0.12"

# Allocator
mimalloc = { version = "0.1", default-features = false }

# Caching
quick_cache = "0.6"
dashmap = "6"

# Logging & Telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
opentelemetry = { version = "0.31.0", features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio", "metrics", "logs", "experimental_metrics_custom_reader"] }
opentelemetry-otlp = { version = "0.31.0", features = ["trace", "metrics", "logs", "http-proto", "reqwest-blocking-client"] }
opentelemetry-appender-tracing = "0.31"
tracing-opentelemetry = "0.32"
tower-http = { version = "0.6", features = ["trace"] }

# Environment
dotenv = "0.15"

# CLI
clap = { version = "4", features = ["derive"] }

# HTTP
bytes = "1.5"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }

# AI Gateway - LLM Provider SDKs
async-openai = "0.32"
async-anthropic = "0.6"
google-generative-ai-rs = { version = "0.3", features = ["beta"] }
aws-sdk-bedrock = "1"
aws-sdk-bedrockruntime = "1.122"
aws-config = { version = "1.8", features = ["behavior-version-latest"] }
aws-smithy-types = { version = "1", features = ["serde-deserialize", "serde-serialize"] }
aws-credential-types = "1"

# Hashing
sha2 = "0.10"
hex = "0.4"
base64 = { version = "0.22", features = ["alloc"] }
hmac = "0.12"

# Enum utilities
strum = { version = "0.26", features = ["derive"] }

# IP/CIDR (trusted proxy)
ipnetwork = "0.20"

# Utilities
rand = "0.8"
urlencoding = "2.1"
jsonschema = { version = "0.44.1", default-features = false }

[dev-dependencies]
reiver-core = { path = "../core", features = ["test-utils"] }
rust_decimal_macros = "1.34"
tower = "0.5"
wiremock = "0.6"
