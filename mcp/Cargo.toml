[package]
name = "reiver-mcp"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"

[[bin]]
name = "reiver-mcp"
path = "src/main.rs"

[dependencies]
reiver-core = { path = "../core" }

# Database (needed for ActionContext to hold a PgPool for in-process slot resolution)
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres"] }

# MCP protocol
rmcp = { version = "1.2", features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
    "schemars",
] }

# Web framework (for SSE transport)
axum = { version = "0.8.8" }
tokio = { version = "1", features = ["full"] }

# HTTP client for internal API calls
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"

# Types
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Async utilities
futures = "0.3"

# Error handling
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"

# Logging & Telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
opentelemetry = { version = "0.31.0", features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio", "metrics", "logs"] }
opentelemetry-otlp = { version = "0.31.0", features = ["trace", "metrics", "logs", "http-proto", "reqwest-blocking-client"] }
opentelemetry-appender-tracing = "0.31"
tracing-opentelemetry = "0.32"
tower-http = { version = "0.6", features = ["trace"] }

# CLI
clap = { version = "4", features = ["derive"] }

# URL encoding for query parameters
urlencoding = "2.1"

# Environment
dotenv = "0.15"

# Allocator
mimalloc = { version = "0.1", default-features = false }
