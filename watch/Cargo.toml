[package]
name = "reiver-watch"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"

[features]
default = []
test-utils = []

[[bin]]
name = "reiver-watch"
path = "src/main.rs"

[dependencies]
reiver-core = { path = "../core" }


# Web framework
axum = { version = "0.8.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["io-util"] }
async-stream = "0.3"

# Database
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "mysql", "chrono", "uuid", "json", "rust_decimal"] }
clickhouse = { version = "0.14.1", features = ["inserter", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1.6", features = ["v4", "serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simd-json = { version = "0.14", features = ["serde_impl"] }
regex = "1.10"
aho-corasick = "1.1.4"
once_cell = "1.19"

# Redis
redis = { version = "1.0.1", features = ["tokio-comp", "connection-manager"] }
bb8 = "0.9.1"
bb8-redis = "0.26.0"

# Kafka
rdkafka = { version = "0.38.0", features = ["cmake-build", "ssl", "gssapi-vendored", "libz-static"] }

# Hashing
sha2 = "0.10"
hmac = "0.12"
blake3 = "1"
hex = "0.4"
base64 = { version = "0.22", features = ["alloc"] }

# Authentication (GitHub App JWT signing)
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }

# Compression
flate2 = "1.0"

# Error handling
anyhow = "1.0"
async-trait = "0.1"
thiserror = "1.0"

# Synchronization
#parking_lot = "0.12"

# Allocator
tikv-jemallocator = "0.6"

# Profiling (CPU + heap)
reiver-sdk = { path = "../sdk/rust", features = ["profiling", "jemalloc"] }

itoa = "1"

# Caching
quick_cache = "0.6"

# Parallel processing (PII scanning, log batch transforms)
rayon = "1"

# Logging & Telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio", "metrics"] }
opentelemetry-otlp = { version = "0.31.0", features = ["trace", "metrics", "http-proto", "reqwest-blocking-client"] }
tower-http = { version = "0.6", features = ["trace"] }

# Environment
dotenv = "0.15"

# Random
rand = "0.8"

# OpenTelemetry Protocol (OTLP)
opentelemetry = { version = "0.31.0", features = ["trace", "metrics"] }
opentelemetry-proto = { version = "0.31.0", features = ["gen-tonic-messages", "with-serde", "trace", "logs", "metrics", "profiles"] }
prost = "0.14"


# HTTP
reqwest = { version = "0.11", features = ["json", "stream"] }
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }

# Arrow / DataFusion (for PromQL evaluation)
datafusion = "51"
arrow = { version = "57", features = ["prettyprint"] }
arrow-array = "57"
arrow-schema = "57"
arrow-ipc = "57"

# URL/Domain
urlencoding = "2.1"

# GitHub integration
octocrab = "0.49.5"
ipnetwork = "0.20"
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Alerting
#pagerduty-rs = "0.1.6"
serenity = { version = "0.12.5", default-features = false, features = ["builder", "http", "utils", "model", "rustls_backend"] }

# CLI
clap = { version = "4", features = ["derive"] }

[[bench]]
name = "hot_path_benchmarks"
harness = false

# Linux-only: jemalloc heap profiling
[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { version = "0.6", features = ["profiling", "unprefixed_malloc_on_supported_platforms"] }
jemalloc_pprof = "0.8"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
mockall = "0.13"
reiver-sdk = { path = "../sdk/rust" }
http = "1"
