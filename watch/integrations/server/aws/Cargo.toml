[package]
name = "reiver-integrations-server-aws"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"

[dependencies]
# AWS SDK
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-ec2 = "1"
aws-sdk-lambda = "1"
aws-sdk-s3 = "1"
aws-sdk-rds = "1"
aws-sdk-redshift = "1"
aws-sdk-dynamodb = "1"
aws-sdk-elasticache = "1"
aws-sdk-ecs = "1"
aws-sdk-eks = "1"
aws-sdk-sqs = "1"
aws-sdk-sns = "1"
aws-sdk-kinesis = "1"
aws-sdk-apigateway = "1"
aws-sdk-cloudfront = "1"
aws-sdk-route53 = "1"
aws-sdk-cloudtrail = "1"
aws-sdk-cloudwatch = "1"
aws-sdk-accessanalyzer = "1"
aws-sdk-sts = "1"  # For IAM role assumption

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"

# Error handling
anyhow = "1.0"
uuid = { version = "1.6", features = ["v4"] }

