[package]
name = "reiver-integrations-server-gcp"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"

[dependencies]
# HTTP client for GCP REST API
reqwest = { version = "0.11", features = ["json"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"

# Error handling
anyhow = "1.0"
uuid = { version = "1.6", features = ["v4"] }

# JWT signing for service account authentication
jsonwebtoken = "9.3"
base64 = "0.22"
