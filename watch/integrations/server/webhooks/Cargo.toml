[package]
name = "reiver-integrations-server-webhooks"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"

[dependencies]
# Web framework
axum = { version = "0.8.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Async trait
async-trait = "0.1"

# Logging
tracing = "0.1"

