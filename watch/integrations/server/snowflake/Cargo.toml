[package]
name = "reiver-integrations-server-snowflake"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"

[dependencies]
# Snowflake connector
snowflake-connector-rs = "0.7.3"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"

# Error handling
anyhow = "1.0"
uuid = { version = "1.6", features = ["v4"] }
