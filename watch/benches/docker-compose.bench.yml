version: '3.8'

# Docker Compose for realistic FST vs No-FST benchmarks
# 
# Usage:
#   docker-compose -f benches/docker-compose.bench.yml up -d
#   cargo run --release --bin benchmark_realistic
#   docker-compose -f benches/docker-compose.bench.yml down

services:
  minio:
    image: minio/minio:latest
    container_name: reiver-bench-minio
    ports:
      - "9100:9000"      # S3 API
      - "9101:9001"      # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-bench-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Create bucket on startup
  minio-init:
    image: minio/mc:latest
    container_name: reiver-bench-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/warehouse-bench --ignore-existing;
      mc anonymous set download local/warehouse-bench;
      echo 'Bucket created successfully';
      "

volumes:
  minio-bench-data:
