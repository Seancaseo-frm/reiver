[package]
name = "reiver-herd"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"

[[bin]]
name = "reiver-herd"
path = "src/main.rs"

[dependencies]
reiver-core = { path = "../core", default-features = false }

# Web framework
axum = { version = "0.8.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }
clickhouse = { version = "0.14.1", features = ["inserter", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "v7", "serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"

# Error handling
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"

# Allocator
mimalloc = { version = "0.1", default-features = false }

# Logging & Telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
opentelemetry = { version = "0.31.0", features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio", "metrics", "logs"] }
opentelemetry-otlp = { version = "0.31.0", features = ["trace", "metrics", "logs", "http-proto", "reqwest-blocking-client"] }
opentelemetry-appender-tracing = "0.31"
tracing-opentelemetry = "0.32"
tower-http = { version = "0.6", features = ["trace"] }

# Environment
dotenv = "0.15"

# CLI
clap = { version = "4", features = ["derive"] }

# HTTP
reqwest = { version = "0.12", features = ["json"] }
futures = "0.3"

# Kafka consumer
rdkafka = { version = "0.38.0", features = ["cmake-build", "ssl", "gssapi-vendored", "libz-static"] }
tokio-stream = "0.1"

# Hashing (HMAC for push notification signatures)
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Enum utilities
strum = { version = "0.26", features = ["derive"] }
dashmap = "6.1.0"
rand = "0.10.1"
