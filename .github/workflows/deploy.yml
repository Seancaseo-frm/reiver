# Disabled: CI/deploy runs on Woodpecker. Uncomment the triggers below to run from GitHub again.
name: Deploy

on:
  workflow_dispatch:
  # push:
  #   branches: [master, main]
  # release:
  #   types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      environment: ${{ steps.environment.outputs.name }}

    strategy:
      matrix:
        project: [website, watch, flow, mcp, herd, docs]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine environment
        id: environment
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            if [ "${{ github.event.release.prerelease }}" == "true" ]; then
              echo "name=dev" >> $GITHUB_OUTPUT
            else
              echo "name=production" >> $GITHUB_OUTPUT
            fi
          else
            echo "name=production" >> $GITHUB_OUTPUT
          fi

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="latest"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.project }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=raw,value=dev-latest,enable=${{ github.event_name == 'release' && github.event.release.prerelease }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.project }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  update-git-tags:
    name: Update Git with image tags
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Kustomize overlay with image tags
        env:
          VERSION: ${{ needs.build-and-push.outputs.version }}
          ENVIRONMENT: ${{ needs.build-and-push.outputs.environment }}
          REGISTRY_PREFIX: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}
        run: |
          OVERLAY="deploy/k8s/overlays/$ENVIRONMENT"
          sed -i "s|REPLACE_REGISTRY_PREFIX|$REGISTRY_PREFIX|g" "$OVERLAY/kustomization.yaml"
          if [ "$ENVIRONMENT" == "production" ]; then
            sed -i "s|newTag: .*|newTag: $VERSION|g" "$OVERLAY/kustomization.yaml"
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/overlays/
          if ! git diff --staged --quiet; then
            git commit -m "chore(deploy): set image tags for ${{ needs.build-and-push.outputs.environment }} to ${{ needs.build-and-push.outputs.version }}"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi
