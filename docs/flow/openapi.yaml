  /api/llm/prompts/rollouts:
    post:
      tags: [Rollouts]
      summary: Create a rollout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, config_id, target_version_id]
              properties:
                project_id:
                  type: string
                  format: uuid
                config_id:
                  type: string
                  format: uuid
                target_version_id:
                  type: string
                  format: uuid
                name:
                  type: string
                mode:
                  type: string
                  enum: [auto, manual]
                  default: auto
                allocation_type:
                  type: string
                  enum: [random, user_sticky, session_sticky]
                stages:
                  type: array
                  items:
                    type: object
                    properties:
                      weight:
                        type: integer
                      min_duration_minutes:
                        type: integer
                      min_requests:
                        type: integer
                      max_error_rate_increase:
                        type: string
                      max_latency_increase_pct:
                        type: string
                      min_quality_score:
                        type: string
      responses:
        '201':
          description: Rollout created
    get:
      tags: [Rollouts]
      summary: List rollouts
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
        - name: config_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
