    delete:
      tags: [Integrations]
      summary: Delete a provider integration
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/ProjectIdHeader'
        - $ref: '#/components/parameters/UserIdHeader'
      responses:
        '200':
          description: Deleted

