      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/ProjectIdHeader'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                api_key:
                  type: string
                access_key_id:
                  type: string
                secret_access_key:
                  type: string
                region:
                  type: string
      responses:
        '200':
          description: Connection successful

