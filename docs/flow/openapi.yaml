  # =========================================================================
  # Playground
  # =========================================================================
  /api/llm/playground:
    post:
      tags: [Playground]
      summary: Run a playground prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, messages]
              properties:
                project_id:
                  type: string
                  format: uuid
                model:
                  type: string
                  default: auto
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                      content:
                        oneOf:
                          - type: string
                          - type: array
                            items:
                              type: object
                temperature:
                  type: number
                max_tokens:
                  type: integer
                auto_evaluate:
                  type: boolean
                use_fallback_chain:
                  type: boolean
                enable_introspection:
                  type: boolean
      responses:
        '200':
          description: Playground result

  /api/llm/playground/compare:
    post:
      tags: [Playground]
      summary: Compare models
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, messages, compare_models]
              properties:
                project_id:
                  type: string
                  format: uuid
                messages:
                  type: array
                  items:
                    type: object
                compare_models:
                  type: array
                  items:
                    type: string
                  maxItems: 5
      responses:
        '200':
          description: Model comparison results

  # =========================================================================
  # Search
  # =========================================================================
  /api/llm/search:
    post:
      tags: [Search]
      summary: Text search on LLM requests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, query]
              properties:
                project_id:
                  type: string
                  format: uuid
                query:
                  type: string
                limit:
                  type: integer
                  default: 10
                  maximum: 100
                model:
                  type: string
                user_id:
                  type: string
                session_id:
                  type: string
                start_time:
                  type: string
                  format: date-time
                end_time:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Search results

  # =========================================================================
  # Integrations
  # =========================================================================
  /api/llm/integrations:
    get:
      tags: [Integrations]
      summary: List provider integrations
      parameters:
        - $ref: '#/components/parameters/ProjectIdHeader'
      responses:
        '200':
          description: Integration list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LlmIntegration'
    post:
      tags: [Integrations]
      summary: Create a provider integration
      parameters:
        - $ref: '#/components/parameters/ProjectIdHeader'
        - $ref: '#/components/parameters/UserIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider:
                  type: string
                  enum: [openai, anthropic, google, bedrock, theta]
                api_key:
                  type: string
                access_key_id:
                  type: string
                secret_access_key:
                  type: string
                region:
                  type: string
                enabled:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Integration created

  /api/llm/integrations/{provider}:
    put:
      tags: [Integrations]
      summary: Update a provider integration
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/ProjectIdHeader'
        - $ref: '#/components/parameters/UserIdHeader'
