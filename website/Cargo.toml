[package]
name = "reiver-website"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"

[[bin]]
name = "reiver-website"
path = "src/main.rs"

[features]
default = []
test-utils = ["reiver-core/test-utils"]

[dependencies]
reiver-core = { path = "../core" }
reiver-mcp = { path = "../mcp" }

# Web framework
axum = { version = "0.8.8", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["io-util"] }
futures-util = "0.3"
async-stream = "0.3"
tower = "0.4"
tower-http = { version = "0.6.8", features = ["cors", "trace", "fs", "set-header"] }

# Database
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "mysql", "chrono", "uuid", "json", "rust_decimal"] }
clickhouse = { version = "0.14.1", features = ["inserter", "chrono", "uuid"] }
refinery = "0.9"
klickhouse = { git = "https://github.com/Protryon/klickhouse", features = ["refinery"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1.6", features = ["v4", "serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simd-json = { version = "0.14", features = ["serde_impl"] }
regex = "1.10"
aho-corasick = "1.1.4"
once_cell = "1.19"
arc-swap = "1.7"
rust_decimal = { version = "1.34", features = ["serde"] }

# Redis
redis = { version = "1.0.1", features = ["tokio-comp", "connection-manager"] }
bb8 = "0.9.1"
bb8-redis = "0.26.0"

# Kafka
rdkafka = { version = "0.38.0", features = ["cmake-build", "ssl", "gssapi-vendored", "libz-static"] }

# Hashing
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
blake3 = "1"
base32 = "0.5"
hex = "0.4"

# Encryption
aes-gcm = "0.10"
base64 = { version = "0.22", features = ["alloc"] }

# Authentication
bcrypt = "0.17.1"
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
oauth2 = "4.4"
openidconnect = { version = "3.5", default-features = false, features = ["reqwest"] }
scim_v2 = "0.3.1"
samael = "0.0.19"

# CBOR (WebAuthn)
ciborium = "0.2"
ring = "0.17"

# Compression
flate2 = "1.0"

# Certificate generation
openssl = "0.10"

# MFA
totp-rs = { version = "5.7", features = ["gen_secret"] }
webauthn-rs = { version = "0.5.4", features = ["danger-allow-state-serialisation"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"

# Synchronization
parking_lot = "0.12"

# Allocator
mimalloc = { version = "0.1", default-features = false }

# Small strings
smallvec = "1.15"
smallstr = "0.3"
itoa = "1"

# Thread-safe string interning
lasso = { version = "0.7", features = ["multi-threaded"] }

# Caching
lru = "0.12"
quick_cache = "0.6"
dashmap = "6"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Environment
dotenv = "0.15"
url = "2.5"
urlencoding = "2.1"
idna = "1.0"

# Random
rand = "0.8"

# HTTP
bytes = "1.5"
reqwest = { version = "0.11", features = ["json", "stream"] }
futures = "0.3"
pin-project-lite = "0.2"
tokio-util = { version = "0.7", features = ["io"] }

# Payments
async-stripe = "=1.0.0-rc.6"
async-stripe-types = "=1.0.0-rc.6"
async-stripe-shared = "=1.0.0-rc.6"
async-stripe-checkout = { version = "=1.0.0-rc.6", features = ["checkout_session"] }
async-stripe-billing = { version = "=1.0.0-rc.6", features = [
    "subscription",
    "billing_credit_grant",
    "billing_credit_balance_summary",
    "billing_credit_balance_transaction",
] }

# Alerting
pagerduty-rs = "0.1.6"
serenity = { version = "0.12.5", default-features = false, features = ["builder", "http", "utils", "model", "rustls_backend"] }

# PDF text extraction for knowledge base uploads
pdf-extract = "0.10"

# CLI
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

# Storage
object_store = { version = "0.11", features = ["aws", "gcp", "http"] }
aws-sdk-s3 = "1"
aws-config = { version = "1.8", features = ["behavior-version-latest"] }
