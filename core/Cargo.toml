[package]
name = "reiver-core"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"

[features]
default = []
test-utils = []

[dependencies]
# Web framework
axum = { version = "0.8.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "mysql", "chrono", "uuid", "json", "rust_decimal"] }
clickhouse = { version = "0.14.1", features = ["inserter", "chrono", "uuid"] }
klickhouse = { git = "https://github.com/Protryon/klickhouse", features = ["refinery"] }
#refinery = "0.9"
chrono = { version = "0.4", features = ["serde"] }
#chrono-tz = "0.10"
uuid = { version = "1.6", features = ["v4", "serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.26", features = ["derive"] }
regex = "1.10"
once_cell = "1.19"
arc-swap = "1.7"
rust_decimal = { version = "1.34", features = ["serde"] }
schemars = { version = "0.8", features = ["rust_decimal"] }

# Redis
redis = { version = "1.0.1", features = ["tokio-comp", "connection-manager"] }
bb8 = "0.9.1"
bb8-redis = "0.26.0"

# Kafka
rdkafka = { version = "0.38.0", features = ["cmake-build", "ssl", "gssapi-vendored", "libz-static"] }

# Authentication
#bcrypt = "0.17.1"
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
#openidconnect = { version = "3.5", default-features = false, features = ["reqwest"] }
#scim_v2 = "0.3.1"
samael = "0.0.19"

# Hashing
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
blake3 = "1"
base32 = "0.5"

# Encryption
aes-gcm = "0.10"
base64 = { version = "0.22", features = ["alloc"] }
ring = "0.17"

# CBOR parsing (for COSE keys in WebAuthn)
ciborium = "0.2"

# Compression (for SAML HTTP-Redirect binding)
flate2 = "1.0"

# Certificate generation (for SAML SP certificates)
openssl = "0.10"

# MFA/Authentication
#totp-rs = { version = "5.7", features = ["gen_secret"] }
#webauthn-rs = { version = "0.5.4", features = ["danger-allow-state-serialisation"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"

# Synchronization
parking_lot = "0.12"

# Stack-allocated small strings and vectors
smallvec = "1.15"
smallstr = "0.3"

# Fast number-to-string formatting
itoa = "1"

# Thread-safe string interning
lasso = { version = "0.7", features = ["multi-threaded"] }

# Caching
quick_cache = "0.6"

# Logging & Telemetry
tracing = "0.1"
opentelemetry = { version = "0.31.0", features = ["metrics"] }

# Environment variables
url = "2.5"
urlencoding = "2.1"

# Random
rand = "0.8"

# Template engine
handlebars = "6"

# PII detection — uses OnceLock static regexes (compiled once per process)
# Luhn checksum for credit card validation (same as airlock-rs)
luhn = "1.0.1"

bytes = "1.5"

# PromQL evaluator (DataFusion-based)
promql-parser = "0.8.0"
datafusion = "51"
datafusion-common = "51"
datafusion-expr = "51"
datafusion-physical-expr = "51"
datafusion-physical-plan = "51"
arrow = { version = "57", features = ["prettyprint"] }
arrow-schema = "57"
arrow-array = "57"
bytemuck = { version = "1", features = ["derive"] }

# Serialization extras
futures-util = "0.3"
hex = "0.4"

# Local embedding model for knowledge base vector search
fastembed = "5"

# HTTP utilities
reqwest = { version = "0.11", features = ["json", "stream"] }

# Payments (billing module)
async-stripe = "=1.0.0-rc.6"
async-stripe-types = "=1.0.0-rc.6"
async-stripe-shared = "=1.0.0-rc.6"
async-stripe-core = { version = "=1.0.0-rc.6", features = ["customer", "payment_intent", "setup_intent"] }
async-stripe-billing = { version = "=1.0.0-rc.6", features = [
    "subscription", "invoice", "billing_portal_session",
    "billing_meter", "billing_meter_event",
    "billing_credit_grant", "billing_credit_balance_summary", "billing_credit_balance_transaction",
] }
async-stripe-checkout = { version = "=1.0.0-rc.6", features = ["checkout_session"] }
async-stripe-payment = { version = "=1.0.0-rc.6", features = ["payment_method"] }
async-stripe-webhook = "=1.0.0-rc.6"
aws-config = "1.8.15"

# Storage
object_store = { version = "0.11", features = ["aws", "http"] }
aws-sdk-s3 = "1"

[dev-dependencies]
tempfile = "3"
rust_decimal_macros = "1.34"
