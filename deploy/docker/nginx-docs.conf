server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # VitePress emits .html files while its navigation uses clean URLs. Accept
    # both forms so /legal/privacy and /flow/getting-started resolve at origin.
    location / {
        try_files $uri $uri.html $uri/ $uri/index.html =404;
    }
}
