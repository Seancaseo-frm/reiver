apiVersion: batch/v1
kind: Job
metadata:
  name: drone-delete-secrets
  namespace: drone
spec:
  ttlSecondsAfterFinished: 60
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: run
        image: alpine:3.19
        command: ["sh", "-c", "apk add --no-cache sqlite && sqlite3 /data/database.sqlite 'DELETE FROM secrets; SELECT changes();'"]
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: server-drone
---
apiVersion: v1
kind: Pod
metadata:
  name: drone-sqlite-oneshot
  namespace: drone
spec:
  restartPolicy: Never
  containers:
  - name: run
    image: alpine:3.19
    command: ["sh", "-c", "apk add --no-cache sqlite && sqlite3 /data/database.sqlite 'DELETE FROM secrets; SELECT changes();' && echo DONE"]
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: server-drone
