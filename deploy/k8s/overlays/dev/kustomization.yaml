apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: reiver

resources:
  - ../../base

# Dev overlay: use dev-latest tags. CI replaces REPLACE_REGISTRY_PREFIX with ghcr.io/OWNER/REPO.
images:
  - name: reiver-watch:latest
    newName: REPLACE_REGISTRY_PREFIX-watch
    newTag: dev-latest
  - name: reiver-flow:latest
    newName: REPLACE_REGISTRY_PREFIX-flow
    newTag: dev-latest
  # Pond disabled — re-enable when Pond launches
  # - name: reiver-pond:latest
  #   newName: REPLACE_REGISTRY_PREFIX-pond
  #   newTag: dev-latest
  - name: reiver-website:latest
    newName: REPLACE_REGISTRY_PREFIX-website
    newTag: dev-latest
  - name: reiver-mcp:latest
    newName: REPLACE_REGISTRY_PREFIX-mcp
    newTag: dev-latest
