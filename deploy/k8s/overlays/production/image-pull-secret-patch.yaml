# JSON patch: add imagePullSecrets so the cluster can pull private ghcr.io images.
# Create the secret with: kubectl create secret docker-registry ghcr.io-pull-secret -n reiver --docker-server=ghcr.io --docker-username=YOUR_GITHUB_USER --docker-password=YOUR_TOKEN
- op: add
  path: /spec/template/spec/imagePullSecrets
  value:
    - name: ghcr.io-pull-secret
