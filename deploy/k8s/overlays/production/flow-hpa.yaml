apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: reiver-flow
  namespace: reiver
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: reiver-flow
  minReplicas: 3
  maxReplicas: 9
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
