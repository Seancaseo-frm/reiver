apiVersion: apps/v1
kind: Deployment
metadata:
  name: reiver-website-workers
  namespace: reiver
  labels:
    app: reiver-website-workers
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reiver-website-workers
  template:
    metadata:
      labels:
        app: reiver-website-workers
    spec:
      containers:
        - name: worker
          image: reiver-website:latest
          imagePullPolicy: IfNotPresent
          command: ["./reiver-website"]
          args: ["--mode", "workers"]
          envFrom:
            - secretRef:
                name: reiver-website
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.node.name=$(K8S_NODE_NAME),k8s.pod.name=$(K8S_POD_NAME),k8s.namespace.name=$(K8S_NAMESPACE),service.name=reiver-website-workers,service.version=c04e23aedba7f78a13bdb35e70baf1a7351bd9ea"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
