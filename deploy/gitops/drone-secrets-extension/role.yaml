# Role for the Kubernetes secrets extension to read Secrets in the drone namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: drone-kubernetes-secrets
  namespace: drone
  labels:
    app.kubernetes.io/name: drone-kubernetes-secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
