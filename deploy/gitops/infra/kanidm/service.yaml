# NodePort exposes Kanidm to the host so kanidm_unixd on bare metal nodes can reach it.
# Internal cluster access: kanidm.reiver-infra.svc:8443
# Host access: <node-ip>:30443
apiVersion: v1
kind: Service
metadata:
  name: kanidm
  namespace: reiver-infra
  labels:
    app.kubernetes.io/name: kanidm
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: kanidm
  ports:
    - name: https
      port: 8443
      targetPort: 8443
      nodePort: 30443
      protocol: TCP
