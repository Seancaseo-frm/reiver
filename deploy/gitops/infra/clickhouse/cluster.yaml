apiVersion: clickhouse.com/v1alpha1
kind: ClickHouseCluster
metadata:
  name: clickhouse
spec:
  replicas: 1
  shards: 3
  containerTemplate:
    resources:
      requests:
        cpu: 500m
        memory: 4Gi
      limits:
        cpu: "4"
        memory: 32Gi
    env:
      - name: R2_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: clickhouse-r2-credentials
            key: R2_ACCESS_KEY_ID
      - name: R2_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: clickhouse-r2-credentials
            key: R2_SECRET_ACCESS_KEY
      - name: CH_R2_ENDPOINT
        valueFrom:
          secretKeyRef:
            name: clickhouse-r2-credentials
            key: CH_R2_ENDPOINT
  podTemplate:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - ubuntu-2404-noble-amd64-base
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                clickhouse.com/role: clickhouse-server
            topologyKey: kubernetes.io/hostname
  dataVolumeClaimSpec:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 10Gi
  keeperClusterRef:
    name: clickhouse-keeper
  settings:
    extraUsersConfig:
      profiles:
        default:
          optimize_skip_unused_shards: 1
    extraConfig:
      merge_tree:
        merge_with_ttl_timeout: 3600
        ttl_only_drop_parts: 1
      storage_configuration:
        disks:
          r2_cold:
            type: s3
            endpoint:
              - "@from_env": CH_R2_ENDPOINT
            access_key_id:
              - "@from_env": R2_ACCESS_KEY_ID
            secret_access_key:
              - "@from_env": R2_SECRET_ACCESS_KEY
            s3_strict_upload_part_size: 100000000
        policies:
          tiered:
            volumes:
              a_hot:
                disk: default
              b_cold:
                disk: r2_cold
            move_factor: 0.2
          default:
            volumes:
              local:
                disk: default
  # Built-in Prometheus scrape endpoint: the operator already registers a composable
  # `prometheus` protocol on port 9363 (see clickhouse-operator buildProtocols). Do not
  # duplicate it under settings.extraConfig — that binds [::]:9363 twice and crashes startup.
