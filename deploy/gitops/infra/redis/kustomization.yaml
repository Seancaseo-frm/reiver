# Redis single instance (Bitnami). Port 6379.
# Service: redis-master.reiver-infra.svc:6379 → REDIS_URL=redis://redis-master.reiver-infra.svc:6379
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: reiver-infra

helmCharts:
  - name: redis
    repo: https://charts.bitnami.com/bitnami
    version: "25.3.2"
    releaseName: redis
    namespace: reiver-infra
    valuesInline:
      auth:
        enabled: false
      master:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        persistence:
          size: 8Gi
      replica:
        replicaCount: 0
      architecture: standalone
