{{- if and .Values.kubeRunner.enabled .Values.secretsExtension.enabled }}
# Grant runner SA (and thus the secrets sidecar) permission to read secrets in the release namespace.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "drone.runnerFullname" . }}-secrets-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "drone.runnerLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "drone.runnerFullname" . }}-secrets-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "drone.runnerLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "drone.runnerFullname" . }}-secrets-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "drone.runnerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
