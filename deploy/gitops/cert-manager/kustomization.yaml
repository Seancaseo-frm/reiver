# cert-manager: TLS certificate lifecycle management.
# Required by Redpanda (and optionally CloudNativePG) for automatic TLS.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cert-manager

resources:
  - namespace.yaml

helmCharts:
  - name: cert-manager
    repo: https://charts.jetstack.io
    version: "v1.17.4"
    releaseName: cert-manager
    namespace: cert-manager
    valuesInline:
      crds:
        enabled: true
