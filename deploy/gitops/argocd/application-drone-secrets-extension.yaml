# Argo CD Application: Drone Kubernetes secrets extension.
# Runner uses this to resolve from_secret (git_push_token, etc.) from K8s Secret drone-repo-secrets.
# Create secrets drone-secret-plugin and drone-repo-secrets before or after sync (see deploy/docs/DRONE.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: drone-secrets-extension
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argocd.io
spec:
  project: reiver
  source:
    repoURL: REPLACE_REPO_URL
    path: deploy/gitops/drone-secrets-extension
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: drone
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
