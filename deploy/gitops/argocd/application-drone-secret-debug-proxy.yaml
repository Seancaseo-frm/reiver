# Debug proxy: forwards runner secret requests to drone-kubernetes-secrets and logs them.
# Runner is pointed at this so builds still run. View logs: kubectl logs -n drone deployment/drone-secret-debug-proxy -f
# To disable: delete this Application and set DRONE_SECRET_PLUGIN_ENDPOINT back to http://drone-kubernetes-secrets:3000 in application-drone.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: drone-secret-debug-proxy
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argocd.io
spec:
  project: reiver
  source:
    repoURL: https://github.com/your-org/reiver.git
    path: deploy/gitops/drone-secret-debug-proxy
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: drone
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
